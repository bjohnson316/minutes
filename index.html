<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minutes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111D" media="(prefers-color-scheme: dark)">
<title>Minute Taker</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: library rail on the left, recorder console on top, transcript and summary side by side below. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --line:#D4DAE5;
  --fg:#141A2A; --muted:#5A6378; --accent:#2F4BD8; --accent-fg:#FFFFFF; --accent-soft:#E3E8FC;
  --rec:#D63A40; --rec-soft:#FBE4E5; --ok:#1C7F53; --warn:#9A6412;
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D111D; --surface:#151A2A; --surface-2:#1C2236; --line:#2A3250;
    --fg:#E6E9F2; --muted:#97A0B7; --accent:#8FA2FF; --accent-fg:#0D111D; --accent-soft:#232C52;
    --rec:#FF5C61; --rec-soft:#3A1C22; --ok:#4FC690; --warn:#E3B05A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111D; --surface:#151A2A; --surface-2:#1C2236; --line:#2A3250;
  --fg:#E6E9F2; --muted:#97A0B7; --accent:#8FA2FF; --accent-fg:#0D111D; --accent-soft:#232C52;
  --rec:#FF5C61; --rec-soft:#3A1C22; --ok:#4FC690; --warn:#E3B05A; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;flex:none;border-radius:8px;box-shadow:0 1px 2px rgba(10,14,30,.25)}
.top .actions{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* library */
.library{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.library summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.library summary::-webkit-details-marker{display:none}
.library summary .count{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.lib-list{display:flex;flex-direction:column;max-height:70vh;overflow:auto;border-top:1px solid var(--line)}
.lib-item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.lib-item:last-child{border-bottom:0}
.lib-item:hover{background:var(--surface-2)}
.lib-item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lib-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lib-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-family:var(--f-body);letter-spacing:.02em}
.chip.ok{color:var(--ok)}
.chip.rec{color:var(--rec);background:var(--rec-soft)}
.chip.accent{color:var(--accent);background:var(--accent-soft)}

main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* meeting meta */
.meta{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.meta .title{grid-column:1/-1;border:0;background:transparent;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em;padding:2px 0;width:100%;min-width:0}
.meta .title::placeholder{color:var(--muted);opacity:.6}
.meta .title:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.meta-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input{border:0;background:transparent;min-width:0;padding:0}
.field input:focus{outline:none}
.field.grow{flex:1 1 260px}
.field.grow input{width:100%}

/* recorder console */
.recorder{padding:18px;display:flex;flex-direction:column;gap:14px}
.deck{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.recbtn{width:72px;height:72px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;transition:border-color .2s}
.recbtn .core{width:30px;height:30px;border-radius:50%;background:var(--rec);transition:all .2s}
.recbtn:hover{border-color:var(--rec)}
.recbtn.on{border-color:var(--rec)}
.recbtn.on .core{width:24px;height:24px;border-radius:5px}
.clock{display:flex;flex-direction:column;gap:2px;min-width:132px}
.clock .time{font-family:var(--f-mono);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock .state{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.clock .state.live{color:var(--rec)}
.clock .state.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.meter{flex:1 1 200px;height:56px;min-width:0;display:block}
.deck .ctrls{display:flex;gap:8px}
.under{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{flex:1 1 280px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 4px 0 12px;background:var(--bg);min-width:0}
.note input{flex:1;border:0;background:transparent;padding:9px 0;min-width:0}
.note input:focus{outline:none}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
.status.warn{color:var(--warn)}
.status.err{color:var(--rec)}

/* panes */
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1150px){.panes{grid-template-columns:minmax(0,1fr)}}
.pane{display:flex;flex-direction:column;min-width:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.pane-head .tools{display:flex;gap:6px;flex-wrap:wrap}
.segs{max-height:62vh;overflow:auto;padding:8px 0}
.seg{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:6px 18px}
.seg:hover{background:var(--surface-2)}
.seg .ts{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.seg .txt{outline:none;border-radius:4px;overflow-wrap:anywhere}
.seg .txt:focus{box-shadow:0 0 0 2px var(--accent-soft);background:var(--surface)}
.seg.note .txt{font-weight:600}
.seg.note .ts{color:var(--accent)}
.seg.interim .txt{color:var(--muted);font-style:italic}
.empty{padding:28px 18px;color:var(--muted);text-align:left;max-width:52ch}
.empty strong{color:var(--fg);display:block;margin-bottom:4px}

/* summary */
.sum{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.sum h3{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.sum .overview{margin:0;outline:none;font-size:15.5px;line-height:1.6;max-width:68ch}
.sum ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sum li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:start;padding:3px 0}
.sum li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px;margin-left:3px}
.sum li.action{grid-template-columns:18px minmax(0,1fr) auto}
.sum li.action::before{width:12px;height:12px;border-radius:3px;background:transparent;border:1.5px solid var(--accent);margin-top:5px;margin-left:1px}
.ed{outline:none;border-radius:4px;overflow-wrap:anywhere;min-height:1.5em}
.ed:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.ed:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.ai-fields{display:flex;flex-direction:column;gap:2px}
.ai-sub{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ai-sub span.lbl{font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;margin-right:4px}
.ai-sub .ed{display:inline-block;min-width:4ch}
.x{all:unset;cursor:pointer;color:var(--muted);opacity:0;padding:0 4px;font-size:16px;line-height:1.4}
li:hover .x,.x:focus-visible{opacity:1}
@media (hover:none){.x{opacity:.6}}
.add{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none}
.add:hover{color:var(--accent)}
.exports{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.audio-list{display:flex;flex-direction:column;gap:8px;padding:0 18px 16px}
.audio-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.audio-row audio{flex:1 1 240px;min-width:0;height:36px}
.audio-row .lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.danger{color:var(--rec)}
.no-meeting{padding:32px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;color:var(--muted)}
.no-meeting strong{color:var(--fg);font-family:var(--f-display);font-size:20px}
.no-meeting .btn{margin-top:6px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,10,20,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-family:var(--f-display);font-size:20px}
.dlg label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.dlg input[type=text],.dlg input[type=password],.dlg select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400}
.dlg .hint{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.45}
.dlg .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.dlg .chk input{margin-top:4px}
.sync .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .sdot{background:var(--ok)}
.sync.busy .sdot{background:var(--accent);animation:blink 1s infinite}
.sync.bad .sdot{background:var(--rec)}
.store-box .btns{display:flex;gap:8px}
.store-box{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.dlg .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2547"/><stop offset="1" stop-color="#0B0F1C"/></linearGradient><linearGradient id="lgwv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8270"/><stop offset="1" stop-color="#E23748"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lgbg)"/><rect x="92" y="208" width="28" height="96" rx="14" fill="url(#lgwv)"/><rect x="140" y="156" width="28" height="200" rx="14" fill="url(#lgwv)"/><rect x="188" y="182" width="28" height="148" rx="14" fill="url(#lgwv)"/><rect x="236" y="224" width="28" height="64" rx="14" fill="url(#lgwv)"/><rect x="300" y="182" width="120" height="28" rx="14" fill="#EEF1FF"/><rect x="300" y="242" width="120" height="28" rx="14" fill="#EEF1FF"/><rect x="300" y="302" width="72" height="28" rx="14" fill="#8FA2FF"/></svg>Minute Taker</div>
    <div class="actions">
      <button class="btn" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New meeting</button>
      <button class="btn ghost sync" id="syncBtn" type="button" hidden><span class="sdot" aria-hidden="true"></span><span class="lbl">Sign in</span></button>
      <button class="btn ghost" id="setBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </div>
  </header>

  <div class="layout">
    <details class="library" id="library">
      <summary>Meetings <span class="count" id="libCount">0</span></summary>
      <div class="lib-list" id="libList"></div>
    </details>

    <main>
      <section class="card no-meeting" id="noMeeting" hidden>
        <strong>No meetings yet</strong>
        <span>Tap New meeting to start recording.</span>
        <button class="btn primary" type="button" id="emptyNew">New meeting</button>
      </section>
      <section class="card meta" aria-label="Meeting details">
        <input class="title" id="mTitle" type="text" placeholder="Untitled meeting" aria-label="Meeting title">
        <div class="meta-row">
          <div class="field"><label for="mDate">When</label><input id="mDate" type="datetime-local"></div>
          <div class="field grow"><label for="mPeople">Attendees</label><input id="mPeople" type="text" placeholder="Names, separated by commas"></div>
          <button class="btn ghost danger" id="delBtn" type="button">Delete</button>
        </div>
      </section>

      <section class="card recorder" aria-label="Recorder">
        <div class="deck">
          <button class="recbtn" id="recBtn" type="button" aria-label="Start recording"><span class="core"></span></button>
          <div class="clock">
            <div class="time" id="clock">00:00</div>
            <div class="state" id="recState">Ready</div>
          </div>
          <canvas class="meter" id="meter" aria-hidden="true"></canvas>
          <div class="ctrls">
            <button class="btn" id="pauseBtn" type="button" disabled>Pause</button>
            <button class="btn" id="stopBtn" type="button" disabled>Stop</button>
          </div>
        </div>
        <div class="under">
          <form class="note" id="noteForm">
            <label class="sr" for="noteIn">Add a note</label>
            <input id="noteIn" type="text" placeholder="Type a note or action item and press Enter" autocomplete="off">
            <button class="btn ghost" type="submit">Add</button>
          </form>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>

      <div class="panes">
        <section class="card pane" aria-label="Transcript">
          <div class="pane-head">
            <h2>Transcript <span class="chip" id="segCount">0 lines</span></h2>
            <div class="tools">
              <button class="btn ghost" id="importBtn" type="button">Import text</button>
              <button class="btn ghost" id="clearBtn" type="button">Clear</button>
              <input type="file" id="importFile" accept=".txt,.vtt,.srt,.md,text/plain" hidden>
            </div>
          </div>
          <div class="segs" id="segs"></div>
          <div class="audio-list" id="audioList"></div>
        </section>

        <section class="card pane" aria-label="Summary">
          <div class="pane-head">
            <h2>Summary <span class="chip" id="sumSource" hidden></span></h2>
            <div class="tools">
              <button class="btn primary" id="sumBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>Summarize</button>
            </div>
          </div>
          <div class="sum" id="sum"></div>
          <div class="exports">
            <button class="btn" id="pdfBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Export PDF</button>
            <button class="btn" id="pptBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Export PowerPoint</button>
            <button class="btn ghost" id="copyBtn" type="button">Copy as text</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<dialog id="settings">
  <form class="dlg" method="dialog" id="setForm">
    <h2>Settings</h2>
    <label class="f">Claude API key
      <input type="password" id="sKey" autocomplete="off" placeholder="sk-ant-...">
      <span class="hint">Used for AI summaries. It stays in this browser and is only sent to api.anthropic.com. Without a key, the app makes a quick keyword-based summary on your device.</span>
    </label>
    <label class="f">Model
      <input type="text" id="sModel" autocomplete="off">
    </label>
    <label class="f">Transcription language
      <select id="sLang">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-US">Spanish (US)</option>
        <option value="es-MX">Spanish (Mexico)</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="pt-BR">Portuguese (Brazil)</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="sAudio"><span>Save audio recordings<br><span class="hint">Turn off if live transcription stops working on your phone; some phones can't record audio and transcribe at the same time.</span></span></label>
    <label class="chk"><input type="checkbox" id="sTrans"><span>Include full transcript in PDF exports</span></label>
    <div class="store-box" id="syncBox" hidden>
      <div style="flex:1 1 220px;min-width:0"><strong>Sync across devices</strong><div class="hint" id="sSync"></div></div>
      <div class="btns"><button class="btn primary" type="button" id="sSignIn">Sign in with Google</button><button class="btn" type="button" id="sSignOut" hidden>Sign out</button></div>
    </div>
    <div class="store-box">
      <div><strong>Audio storage</strong><div class="hint" id="sStore">Checking…</div></div>
      <button class="btn danger" type="button" id="sDelAudio">Delete all audio</button>
    </div>
    <div class="row">
      <button class="btn ghost danger" type="button" id="sClear">Remove API key</button>
      <div style="display:flex;gap:8px">
        <button class="btn" value="cancel" type="submit">Cancel</button>
        <button class="btn primary" value="save" type="submit" id="sSave">Save</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LS_KEY = 'minutetaker.meetings.v1', LS_SET = 'minutetaker.settings.v1';

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{ toast('Could not save. Browser storage is full or blocked.'); } }
};
const idb = {
  _db:null,
  open(){ return this._db || (this._db = new Promise((res, rej) => {
    const r = indexedDB.open('minutetaker', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('audio');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => {
    const t = db.transaction('audio', mode); const req = fn(t.objectStore('audio'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }); },
  put(k, v){ return this.tx('readwrite', s => s.put(v, k)); },
  get(k){ return this.tx('readonly', s => s.get(k)); },
  del(k){ return this.tx('readwrite', s => s.delete(k)); }
};

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
function fmt(sec){ sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function localISO(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function niceDate(iso){ if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return ''; return d.toLocaleString(undefined, {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}); }
function shortDate(iso){ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
const titleOf = m => (m.title || '').trim() || 'Untitled meeting';
function slug(s){ return (s || 'meeting').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'meeting'; }
function fileBase(m){ return `${slug(titleOf(m).replace(/^example:\s*/i,''))}-${(m.date||'').slice(0,10) || 'undated'}`; }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }
function setStatus(msg, kind = ''){ const s = $('#status'); s.textContent = msg; s.className = 'status' + (kind ? ' ' + kind : ''); }
function el(tag, props = {}, kids = []){ const e = document.createElement(tag); for(const [k,v] of Object.entries(props)){ if(k === 'class') e.className = v; else if(k === 'text') e.textContent = v; else if(k.startsWith('on')) e.addEventListener(k.slice(2), v); else if(v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v); } for(const c of [].concat(kids)) if(c) e.append(c); return e; }

/* ---------- data ---------- */
function blankMeeting(){ return { id: uid(), title: '', date: localISO(), attendees: '', segments: [], duration: 0, summary: null, audioParts: 0 }; }
function exampleMeeting(){
  const lines = [
    [0,"Okay let's get started, this is the Q4 training planning meeting."],
    [12,"First item is the live fire burn schedule. The county tower is open the second and fourth Saturday in November."],
    [31,"I think we take the second Saturday, that gives us time to finish the SCBA confidence course first."],
    [50,"Agreed, let's go with November 14th for the burn."],
    [66,"Marcus will reserve the tower and send the confirmation to everyone by Friday."],
    [88,"Next, EMS continuing education. We still need about six hours for the recert cycle."],
    [104,"Can we get the hospital educator to do the airway class again?"],
    [121,"I'll reach out to her this week and see what dates she has in December."],
    [140,"We also need someone to update the sign-in sheet so the hours get logged correctly."],
    [158,"Jenna said she'd handle the sign-in sheet and get it into the shared drive."],
    [175,"Last thing, do we open driver training to the new volunteers or keep it for probies who are already cleared?"],
    [196,"Let's hold that until next meeting when the chief can weigh in."]
  ];
  return {
    id: 'example', example: true, title: 'Example: Q4 training planning', date: localISO(new Date(Date.now() - 86400000)),
    attendees: 'Marcus, Jenna, Training officer', duration: 212, audioParts: 0,
    segments: lines.map(([t, text]) => ({t, text})),
    summary: {
      source: 'example',
      overview: 'The group set the Q4 training calendar. The live fire burn is scheduled for November 14 at the county tower, after the SCBA confidence course is complete. EMS continuing education still needs about six hours, and the hospital educator will be asked to repeat the airway class in December. Whether new volunteers join driver training was deferred to the next meeting.',
      keyPoints: ['County burn tower is available the second and fourth Saturdays in November.', 'SCBA confidence course should be finished before the live burn.', 'About six EMS con-ed hours are still needed for the recert cycle.'],
      decisions: ['Live fire burn will be held Saturday, November 14.'],
      actionItems: [
        {task:'Reserve the burn tower and send confirmation to the group', owner:'Marcus', due:'Friday'},
        {task:'Contact the hospital educator about December airway class dates', owner:'Training officer', due:'This week'},
        {task:'Update the training sign-in sheet and post it to the shared drive', owner:'Jenna', due:''}
      ],
      openQuestions: ['Should driver training be open to new volunteers or only cleared probies?'],
      nextSteps: ['Revisit driver training eligibility with the chief at the next meeting.']
    }
  };
}

let meetings = store.get(LS_KEY, null);
if(!Array.isArray(meetings)) meetings = [exampleMeeting()];
let settings = Object.assign({ apiKey:'', model:'claude-sonnet-5-5', lang: navigator.language && /^(en|es|fr|de|pt)/.test(navigator.language) ? navigator.language : 'en-US', saveAudio:true, includeTranscript:false }, store.get(LS_SET, {}));
let current = meetings[0] || null;
let saveT;
function save(){ store.set(LS_KEY, meetings); scheduleSync(); }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(() => { save(); renderLibrary(); }, 400); }

/* ---------- library ---------- */
function renderLibrary(){
  const list = $('#libList'); list.textContent = '';
  $('#libCount').textContent = meetings.length;
  for(const m of meetings){
    const chips = [];
    if(rec.active && m === current) chips.push(el('span', {class:'chip rec', text:'Recording'}));
    else if(m.summary) chips.push(el('span', {class:'chip ok', text:'Summarized'}));
    else if(m.segments.length) chips.push(el('span', {class:'chip', text:`${m.segments.length} lines`}));
    const b = el('button', {class:'lib-item', type:'button', 'aria-current': m === current ? 'true' : 'false', onclick: () => select(m)}, [
      el('span', {class:'lib-title', text: titleOf(m)}),
      el('span', {class:'lib-meta'}, [el('span', {text: shortDate(m.date)}), el('span', {text: fmt(m.duration||0)}), ...chips])
    ]);
    list.append(b);
  }
}
function select(m){
  if(rec.active){ toast('Stop recording before switching meetings.'); return; }
  current = m; renderAll();
  if(window.innerWidth <= 900) $('#library').open = false;
}

/* ---------- meta ---------- */
function renderMeta(){
  $('#mTitle').value = current.title || '';
  $('#mDate').value = current.date || '';
  $('#mPeople').value = current.attendees || '';
}
$('#mTitle').addEventListener('input', e => { current.title = e.target.value; saveSoon(); });
$('#mDate').addEventListener('input', e => { current.date = e.target.value; saveSoon(); });
$('#mPeople').addEventListener('input', e => { current.attendees = e.target.value; saveSoon(); });

$('#newBtn').addEventListener('click', () => {
  if(rec.active){ toast('Stop recording before starting a new meeting.'); return; }
  const m = blankMeeting(); meetings.unshift(m); current = m; save(); renderAll(); $('#mTitle').focus();
});
$('#delBtn').addEventListener('click', async () => {
  if(rec.active){ toast('Stop recording first.'); return; }
  if(!confirm(`Delete "${titleOf(current)}"? Its transcript, summary and audio will be removed from this device.`)) return;
  for(let i = 1; i <= (current.audioParts||0); i++){ try{ await idb.del(`${current.id}:${i}`); }catch{} }
  if(!current.example) markDeleted(current.id);
  meetings = meetings.filter(m => m !== current);
  current = meetings[0] || null; save(); renderAll(); toast('Meeting deleted.');
});

/* ---------- transcript ---------- */
function renderTranscript(){
  const box = $('#segs'); box.textContent = '';
  const n = current.segments.length;
  $('#segCount').textContent = `${n} line${n === 1 ? '' : 's'}`;
  if(!n && !rec.interim){
    box.append(el('div', {class:'empty'}, [el('strong', {text:'No transcript yet'}), el('span', {text:'Press the red button to record. Speech appears here as it is heard, and you can tap any line to fix a word. You can also import a transcript from a text, VTT or SRT file.'})]));
  }
  current.segments.forEach(s => box.append(segRow(s)));
  const ir = el('div', {class:'seg interim', id:'interim'}, [el('span', {class:'ts', text:''}), el('div', {class:'txt', text: rec.interim || ''})]);
  ir.hidden = !rec.interim; box.append(ir);
}
function segRow(s){
  const txt = el('div', {class:'txt', contenteditable:'true', spellcheck:'true', text: s.text});
  txt.addEventListener('input', () => { s.text = txt.textContent; saveSoon(); });
  txt.addEventListener('blur', () => { if(!txt.textContent.trim()){ current.segments = current.segments.filter(x => x !== s); save(); renderTranscript(); } });
  return el('div', {class:'seg' + (s.note ? ' note' : '')}, [el('span', {class:'ts', text: (s.note ? 'NOTE ' : '') + fmt(s.t)}), txt]);
}
function nearBottom(box){ return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }
function addSegment(text, note = false, t){
  text = (text || '').replace(/\s+/g, ' ').trim(); if(!text) return;
  text = text.charAt(0).toUpperCase() + text.slice(1);
  const seg = {t: t ?? (rec.segStart ?? elapsed()), text}; if(note) seg.note = true;
  current.segments.push(seg);
  if(!note) rec.segStart = null;
  const box = $('#segs'); const stick = nearBottom(box);
  if(current.segments.length === 1) renderTranscript();
  else { box.insertBefore(segRow(seg), $('#interim')); $('#segCount').textContent = `${current.segments.length} lines`; }
  if(stick) box.scrollTop = box.scrollHeight;
  saveSoon();
}
function renderInterim(){
  const ir = $('#interim'); if(!ir) return;
  ir.querySelector('.txt').textContent = rec.interim; ir.querySelector('.ts').textContent = rec.interim ? fmt(rec.segStart ?? elapsed()) : '';
  ir.hidden = !rec.interim;
  if(rec.interim && current.segments.length === 0 && $('#segs .empty')) $('#segs .empty').remove();
  const box = $('#segs'); if(nearBottom(box)) box.scrollTop = box.scrollHeight;
}
function transcriptText(m = current){ return m.segments.map(s => `[${fmt(s.t)}]${s.note ? ' (note)' : ''} ${s.text}`).join('\n'); }

$('#noteForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#noteIn').value; if(!v.trim()) return; addSegment(v, true, elapsed()); $('#noteIn').value = ''; });
$('#clearBtn').addEventListener('click', () => {
  if(rec.active){ toast('Stop recording first.'); return; }
  if(!current.segments.length) return;
  if(!confirm('Clear the whole transcript for this meeting?')) return;
  current.segments = []; current.duration = 0; save(); renderTranscript(); renderClock();
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  const raw = await f.text(); let added = 0, lastT = current.duration || 0;
  const tsRe = /(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,]\d+)?/;
  for(let line of raw.split(/\r?\n/)){
    line = line.trim();
    if(!line || /^WEBVTT/i.test(line) || /^\d+$/.test(line) || /^NOTE\b/.test(line)) continue;
    if(/-->/.test(line)){ const m = line.match(tsRe); if(m) lastT = (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]); continue; }
    const lead = line.match(/^\[?((?:\d+:)?\d{1,2}:\d{2})\]?\s+(.*)$/);
    if(lead){ const p = lead[1].split(':').map(Number); lastT = p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; line = lead[2]; }
    line = line.replace(/<[^>]+>/g, '').trim(); if(!line) continue;
    current.segments.push({t: lastT, text: line}); added++;
  }
  current.duration = Math.max(current.duration||0, lastT);
  if(!current.title.trim()) current.title = f.name.replace(/\.[^.]+$/, '');
  save(); renderAll(); toast(added ? `Imported ${added} lines.` : 'No text found in that file.');
});

/* ---------- audio playback ---------- */
let audioURLs = [];
async function renderAudio(){
  const box = $('#audioList'); box.textContent = '';
  audioURLs.forEach(u => URL.revokeObjectURL(u)); audioURLs = [];
  const m = current;
  for(let i = 1; i <= (m.audioParts||0); i++){
    let blob; try{ blob = await idb.get(`${m.id}:${i}`); }catch{}
    if(m !== current) return;
    if(!blob) continue;
    const url = URL.createObjectURL(blob); audioURLs.push(url);
    const ext = /mp4|m4a|aac/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm';
    const dl = el('button', {class:'btn ghost', type:'button', text:'Download', onclick: () => { const a = el('a', {href:url, download:`${fileBase(m)}-part${i}.${ext}`}); document.body.append(a); a.click(); a.remove(); }});
    const del = el('button', {class:'btn ghost danger', type:'button', text:'Delete', onclick: async () => {
      if(!confirm(`Delete audio ${i} (${mb(blob.size)})? The transcript and summary stay.`)) return;
      try{ await idb.del(`${m.id}:${i}`); toast('Recording deleted.'); }catch{ toast('Couldn\'t delete that recording. Try again.'); }
      renderAudio();
    }});
    box.append(el('div', {class:'audio-row'}, [el('span', {class:'lbl', text:`Audio ${i} · ${mb(blob.size)}`}), el('audio', {controls:true, preload:'metadata', src:url}), dl, del]));
  }
}
const mb = n => n >= 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
async function audioInventory(){
  let count = 0, bytes = 0;
  for(const m of meetings) for(let i = 1; i <= (m.audioParts||0); i++){
    try{ const b = await idb.get(`${m.id}:${i}`); if(b){ count++; bytes += b.size; } }catch{}
  }
  return {count, bytes};
}
async function renderStorage(){
  const out = $('#sStore'), btn = $('#sDelAudio');
  out.textContent = 'Checking…';
  const {count, bytes} = await audioInventory();
  out.textContent = count ? `${count} recording${count === 1 ? '' : 's'} saved, using ${mb(bytes)} on this device.` : 'No audio recordings are saved on this device.';
  btn.disabled = !count || rec.active;
}

/* ---------- recorder ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = { active:false, paused:false, startedAt:0, accum:0, stream:null, media:null, chunks:[], sr:null, srBlocked:false, ctx:null, analyser:null, raf:0, interim:'', segStart:null, levels:[], wake:null };
function elapsed(){ return rec.accum + (rec.active && !rec.paused ? (performance.now() - rec.startedAt) / 1000 : 0); }
function renderClock(){ $('#clock').textContent = fmt(rec.active ? elapsed() : (current.duration||0)); }
function updateRecUI(){
  const b = $('#recBtn');
  b.classList.toggle('on', rec.active);
  b.setAttribute('aria-label', rec.active ? 'Stop recording' : 'Start recording');
  $('#pauseBtn').disabled = !rec.active; $('#stopBtn').disabled = !rec.active;
  $('#pauseBtn').textContent = rec.paused ? 'Resume' : 'Pause';
  const st = $('#recState');
  st.className = 'state' + (rec.active && !rec.paused ? ' live' : '');
  st.textContent = !rec.active ? (current && current.segments.length ? 'Stopped' : 'Ready') : rec.paused ? 'Paused' : 'Recording';
  renderLibrary();
}

async function startRecording(){
  if(rec.active) return;
  if(!current) return;
  if(current.example){ toast('This is an example. Tap New meeting to record your own.'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setStatus('This browser can\'t use the microphone. Open the app over https in Chrome, Edge or Safari.', 'err'); return; }
  try{ rec.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ setStatus(e && e.name === 'NotAllowedError' ? 'Microphone access was blocked. Allow the microphone for this site in your browser settings, then try again.' : 'Couldn\'t open the microphone: ' + (e.message || e), 'err'); return; }
  rec.active = true; rec.paused = false; rec.srBlocked = false; rec.accum = current.duration || 0; rec.startedAt = performance.now(); rec.interim = ''; rec.segStart = null;
  try{ rec.ctx = new (window.AudioContext || window.webkitAudioContext)(); const src = rec.ctx.createMediaStreamSource(rec.stream); rec.analyser = rec.ctx.createAnalyser(); rec.analyser.fftSize = 512; src.connect(rec.analyser); }catch{ rec.analyser = null; }
  if(settings.saveAudio && window.MediaRecorder){
    try{ rec.chunks = []; rec.media = new MediaRecorder(rec.stream); rec.media.ondataavailable = e => { if(e.data && e.data.size) rec.chunks.push(e.data); }; rec.media.start(1000); }
    catch{ rec.media = null; }
  }
  if(SR) startSR(); else setStatus('Live transcription isn\'t available in this browser, so only audio is being recorded. Type notes as you go, or use Chrome, Edge or Safari for live transcripts.', 'warn');
  if(SR) setStatus(rec.media ? 'Recording audio and transcribing live.' : 'Transcribing live.');
  try{ rec.wake = await navigator.wakeLock?.request('screen'); }catch{}
  updateRecUI(); loop();
}
function startSR(){
  const r = new SR(); r.continuous = true; r.interimResults = true; r.lang = settings.lang;
  r.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i], txt = res[0].transcript;
      if(rec.segStart == null) rec.segStart = Math.max(0, elapsed() - 2);
      if(res.isFinal) addSegment(txt); else interim += txt;
    }
    rec.interim = interim.trim(); renderInterim();
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ rec.srBlocked = true; setStatus('Live transcription was blocked by the browser. Audio is still recording.', 'warn'); }
    else if(e.error === 'network'){ setStatus('Live transcription needs an internet connection. Audio is still recording.', 'warn'); }
    else if(e.error === 'audio-capture'){ rec.srBlocked = true; setStatus('This device can\'t transcribe while saving audio. Turn off "Save audio" in Settings for live transcripts.', 'warn'); }
  };
  r.onend = () => {
    if(rec.interim){ addSegment(rec.interim); rec.interim = ''; renderInterim(); }
    if(rec.active && !rec.paused && !rec.srBlocked){ setTimeout(() => { if(rec.active && !rec.paused){ try{ r.start(); }catch{} } }, 250); }
  };
  rec.sr = r; try{ r.start(); }catch{}
}
function pauseRecording(){
  if(!rec.active) return;
  if(!rec.paused){
    rec.accum = elapsed(); rec.paused = true;
    try{ rec.media && rec.media.state === 'recording' && rec.media.pause(); }catch{}
    try{ rec.sr && rec.sr.stop(); }catch{}
    setStatus('Paused. Nothing is being recorded.');
  } else {
    rec.startedAt = performance.now(); rec.paused = false;
    try{ rec.media && rec.media.state === 'paused' && rec.media.resume(); }catch{}
    if(rec.sr && !rec.srBlocked){ try{ rec.sr.start(); }catch{} }
    setStatus('Recording resumed.');
  }
  updateRecUI();
}
function stopRecording(){
  if(!rec.active) return;
  const m = current;
  m.duration = elapsed(); rec.active = false; rec.paused = false;
  if(rec.interim){ addSegment(rec.interim); rec.interim = ''; }
  try{ rec.sr && rec.sr.abort(); }catch{} rec.sr = null;
  cancelAnimationFrame(rec.raf);
  const finish = () => {
    rec.stream && rec.stream.getTracks().forEach(t => t.stop()); rec.stream = null;
    try{ rec.ctx && rec.ctx.close(); }catch{} rec.ctx = null; rec.analyser = null;
    try{ rec.wake && rec.wake.release(); }catch{} rec.wake = null;
  };
  if(rec.media && rec.media.state !== 'inactive'){
    const media = rec.media;
    media.onstop = async () => {
      const blob = new Blob(rec.chunks, {type: media.mimeType || 'audio/webm'}); rec.chunks = [];
      finish();
      if(blob.size){
        const part = (m.audioParts||0) + 1;
        try{ await idb.put(`${m.id}:${part}`, blob); m.audioParts = part; save(); if(m === current) renderAudio(); }
        catch{ toast('Couldn\'t save the audio on this device. The transcript is saved.'); }
      }
    };
    try{ media.stop(); }catch{ finish(); }
  } else finish();
  rec.media = null; rec.levels = [];
  save(); updateRecUI(); renderClock(); drawMeter(); renderInterim();
  setStatus(m.segments.length ? 'Stopped. Press Summarize to write up the meeting.' : 'Stopped. No speech was transcribed.');
}
$('#recBtn').addEventListener('click', () => rec.active ? stopRecording() : startRecording());
$('#pauseBtn').addEventListener('click', pauseRecording);
$('#stopBtn').addEventListener('click', stopRecording);
window.addEventListener('beforeunload', e => { if(rec.active){ e.preventDefault(); e.returnValue = ''; } });

function loop(){
  renderClock(); drawMeter();
  if(rec.active) rec.raf = requestAnimationFrame(loop);
}
const buf = new Uint8Array(512);
function drawMeter(){
  const c = $('#meter'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight; if(!w) return;
  if(c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)){ c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const cs = getComputedStyle(document.documentElement);
  const bars = Math.max(10, Math.floor(w / 6));
  if(rec.active && !rec.paused && rec.analyser){
    rec.analyser.getByteTimeDomainData(buf);
    let sum = 0; for(let i = 0; i < buf.length; i++){ const v = (buf[i]-128)/128; sum += v*v; }
    rec.levels.push(Math.min(1, Math.sqrt(sum/buf.length) * 4));
  } else if(rec.active) rec.levels.push(0);
  while(rec.levels.length > bars) rec.levels.shift();
  const live = rec.active && !rec.paused;
  ctx.fillStyle = (live ? cs.getPropertyValue('--rec') : cs.getPropertyValue('--line')).trim();
  for(let i = 0; i < bars; i++){
    const lv = rec.levels[rec.levels.length - bars + i] ?? 0;
    const bh = Math.max(2, lv * (h - 4));
    ctx.fillRect(i*6, (h-bh)/2, 3, bh);
  }
}
window.addEventListener('resize', () => { if(!rec.active) drawMeter(); });

function normalize(o, source){
  const strs = a => Array.isArray(a) ? a.map(x => typeof x === 'string' ? x : (x && (x.text || x.item)) || '').map(x => x.trim()).filter(Boolean) : [];
  return {
    source, overview: typeof o.overview === 'string' ? o.overview.trim() : '',
    keyPoints: strs(o.keyPoints), decisions: strs(o.decisions), openQuestions: strs(o.openQuestions), nextSteps: strs(o.nextSteps),
    actionItems: Array.isArray(o.actionItems) ? o.actionItems.map(a => typeof a === 'string' ? {task:a, owner:'', due:''} : {task:String(a.task||'').trim(), owner:String(a.owner||'').trim(), due:String(a.due||'').trim()}).filter(a => a.task) : []
  };
}

async function claudeSummary(m){
  const prompt = `You are a meticulous meeting secretary. Summarize the meeting transcript below. It came from automatic speech recognition, so it may lack punctuation and contain misheard words; infer the intended meaning but never invent facts, names or dates. Speakers are not labeled. Lines marked (note) were typed by the note-taker and are reliable.

Meeting title: ${titleOf(m)}
Date: ${niceDate(m.date) || 'unknown'}
Attendees: ${m.attendees || 'not listed'}

Return ONLY a JSON object, no prose and no code fences, with exactly this shape:
{"title": string, "overview": string, "keyPoints": string[], "decisions": string[], "actionItems": [{"task": string, "owner": string, "due": string}], "openQuestions": string[], "nextSteps": string[]}

Rules:
- "title": keep the given title unless it is "Untitled meeting", in which case write a short descriptive title.
- "overview": 3 to 5 plain sentences covering purpose and outcome.
- Each bullet is one concise sentence. Use empty arrays when a section has nothing.
- "owner" and "due" are "" when the transcript doesn't say.

<transcript>
${transcriptText(m)}
</transcript>`;
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key': settings.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model: settings.model || 'claude-sonnet-5-5', max_tokens: 4000, messages:[{role:'user', content: prompt}] })
    });
  }catch{ throw new Error('Couldn\'t reach Claude. Check your internet connection and try again.'); }
  let data; try{ data = await res.json(); }catch{ data = {}; }
  if(!res.ok){
    const msg = data?.error?.message || res.statusText;
    if(res.status === 401) throw new Error('Claude rejected the API key. Check it in Settings.');
    if(res.status === 404) throw new Error(`Model "${settings.model}" wasn't found. Check the model name in Settings.`);
    if(res.status === 429) throw new Error('Claude is rate limiting this key. Wait a minute and try again.');
    throw new Error('Claude returned an error: ' + msg);
  }
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  let obj; try{ obj = JSON.parse(text.slice(a, b + 1)); }catch{ throw new Error('Claude\'s reply couldn\'t be read. Press Summarize to try again.'); }
  if(obj.title && (!m.title.trim() || /^untitled/i.test(m.title))) m.title = String(obj.title).trim();
  return normalize(obj, 'claude');
}

const STOP = new Set('a an the and or but if then so to of in on at for with from by is are was were be been being it its this that these those i you he she we they me him her us them my your our their what which who whom how when where why do does did doing have has had having will would can could should may might must shall not no yes just very really okay ok um uh like yeah gonna wanna kind sort get got go going there here about into out up down over again also more most some any all each than too as let lets let\'s i\'m we\'re it\'s that\'s don\'t'.split(/\s+/));
function localSummary(m){
  const segs = m.segments.filter(s => s.text.trim());
  const words = t => t.toLowerCase().match(/[a-z0-9']+/g) || [];
  const freq = {}; segs.forEach(s => words(s.text).forEach(w => { if(!STOP.has(w) && w.length > 2) freq[w] = (freq[w]||0) + 1; }));
  const score = s => { const ws = words(s.text).filter(w => !STOP.has(w)); return ws.length ? ws.reduce((a,w) => a + (freq[w]||0), 0) / Math.sqrt(ws.length + 2) : 0; };
  const actionRe = /\b(will|i'll|we'll|he'll|she'll|they'll|need to|needs to|going to|has to|have to|action item|follow up|follow-up|assign|take care of|handle|send|reach out|by (monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|next week|end of (the )?(day|week)|eod|eow))\b/i;
  const decRe = /\b(decided|decide|agreed|agree|let's go with|we'll go with|approved|final answer|settled on|going forward)\b/i;
  const qRe = /\?$|^(what|how|when|where|why|who|should|could|can|do|does|is|are)\b/i;
  const dueRe = /\b(by|before|on|this|next)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|week|month|eod|eow|end of (the )?(day|week|month)|[a-z]+ \d{1,2}(st|nd|rd|th)?)\b/i;
  const ownerRe = /^([A-Z][a-z]+)\s+(will|said (s?he|they)'d|is going to|needs to|to)\b/;
  const actionItems = [], decisions = [], openQuestions = [];
  segs.forEach(s => {
    const t = s.text.trim();
    if(decRe.test(t)) decisions.push(t);
    else if(actionRe.test(t) || (s.note && /^(todo|action|ai)[:\-]/i.test(t))){ const d = t.match(dueRe), o = t.match(ownerRe); actionItems.push({task: t.replace(/^(todo|action|ai)[:\-]\s*/i,''), owner: o ? o[1] : (/^(i'll|i will)\b/i.test(t) ? 'Speaker' : ''), due: d ? d[0].replace(/^(by|before|on)\s+/i,'') : ''}); }
    else if(qRe.test(t)) openQuestions.push(t);
  });
  const ranked = segs.map((s, i) => ({s, i, sc: score(s) + (s.note ? 3 : 0)})).sort((a,b) => b.sc - a.sc);
  const top = n => ranked.slice(0, n).sort((a,b) => a.i - b.i).map(x => x.s.text.trim());
  const used = new Set([...decisions, ...actionItems.map(a => a.task), ...openQuestions]);
  const keyPoints = top(10).filter(t => !used.has(t)).slice(0, 6);
  const themes = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 5).map(x => x[0]);
  const overview = `${titleOf(m)} ran ${fmt(m.duration||0)} with ${segs.length} transcript lines.` + (themes.length ? ` The most discussed topics were ${themes.slice(0,-1).join(', ')}${themes.length > 1 ? ' and ' : ''}${themes[themes.length-1]}.` : '') + ` ${decisions.length} decision${decisions.length===1?'':'s'} and ${actionItems.length} possible action item${actionItems.length===1?'':'s'} were detected. Review and edit before sharing.`;
  return normalize({overview, keyPoints, decisions, actionItems, openQuestions, nextSteps: []}, 'local');
}

function metaLine(m){ return [niceDate(m.date), m.duration ? `${fmt(m.duration)} long` : '', m.attendees ? `Attendees: ${m.attendees}` : ''].filter(Boolean).join('  ·  '); }

const ascii = s => String(s || '').replace(/[‘’‛]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/ /g, ' ').replace(/[^\x09\x0A\x0D\x20-\xFF•]/g, '');

/* ---------- export: PDF ---------- */
$('#pdfBtn').addEventListener('click', () => {
  if(!needSummary()) return;
  if(!window.jspdf){ toast('The PDF tool didn\'t load. Check your connection and reload the page.'); return; }
  const m = current, s = m.summary;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const M = 58, PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), W = PW - 2*M;
  const INK = [20,26,42], MUTED = [90,99,120], ACC = [47,75,216], REC = [214,58,64], LINE = [212,218,229];
  let y = M;
  const ensure = h => { if(y + h > PH - M - 14){ doc.addPage(); y = M; } };
  function text(str, {size=11, style='normal', color=INK, indent=0, gap=4, lh=1.42} = {}){
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    for(const l of doc.splitTextToSize(ascii(str), W - indent)){ ensure(size*lh); doc.text(l, M + indent, y + size); y += size*lh; }
    y += gap;
  }
  function heading(t){ ensure(48); y += 12; doc.setDrawColor(...ACC); doc.setLineWidth(1.5); doc.line(M, y, M + 22, y); y += 9; text(t.toUpperCase(), {size:9.5, style:'bold', color:ACC, gap:5}); }
  function bullets(arr, mark='•'){
    for(const b of arr){
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      const lines = doc.splitTextToSize(ascii(b), W - 18); ensure(15.6);
      doc.setTextColor(...ACC); doc.text(mark, M + 2, y + 11); doc.setTextColor(...INK);
      for(const l of lines){ ensure(15.6); doc.text(l, M + 18, y + 11); y += 15.6; }
      y += 3;
    }
    y += 3;
  }
  // header band
  doc.setFillColor(...REC); doc.circle(M + 4, y + 5, 4, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text('MEETING SUMMARY', M + 14, y + 8.5);
  y += 26;
  text(titleOf(m).replace(/^example:\s*/i,''), {size:22, style:'bold', gap:2, lh:1.2});
  const ml = metaLine(m); if(ml) text(ml, {size:10, color:MUTED, gap:6});
  doc.setDrawColor(...LINE); doc.setLineWidth(0.75); doc.line(M, y, PW - M, y); y += 6;
  if(s.overview){ heading('Overview'); text(s.overview, {size:11.5, lh:1.5, gap:2}); }
  if(s.keyPoints.length){ heading('Key points'); bullets(s.keyPoints); }
  if(s.decisions.length){ heading('Decisions'); bullets(s.decisions); }
  if(s.actionItems.length){
    heading('Action items');
    for(const a of s.actionItems){
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      const lines = doc.splitTextToSize(ascii(a.task), W - 20); ensure(32);
      doc.setDrawColor(...ACC); doc.setLineWidth(1); doc.rect(M + 1, y + 2.5, 9, 9);
      doc.setTextColor(...INK); for(const l of lines){ ensure(15.6); doc.text(l, M + 20, y + 11); y += 15.6; }
      const sub = [a.owner ? `Owner: ${a.owner}` : 'Owner: unassigned', a.due ? `Due: ${a.due}` : ''].filter(Boolean).join('     ');
      doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(ascii(sub), M + 20, y + 9); y += 18;
    }
    y += 2;
  }
  if(s.openQuestions.length){ heading('Open questions'); bullets(s.openQuestions); }
  if(s.nextSteps.length){ heading('Next steps'); bullets(s.nextSteps); }
  if(settings.includeTranscript && m.segments.length){
    doc.addPage(); y = M; heading('Transcript');
    for(const sg of m.segments){
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      const lines = doc.splitTextToSize(ascii(sg.text), W - 52); ensure(13.5);
      doc.setFont('courier','normal'); doc.setTextColor(...MUTED); doc.text(fmt(sg.t), M, y + 9.5);
      doc.setFont('helvetica', sg.note ? 'bold' : 'normal'); doc.setTextColor(...INK);
      for(const l of lines){ ensure(13.5); doc.text(l, M + 52, y + 9.5); y += 13.5; }
      y += 2;
    }
  }
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(ascii(titleOf(m)), M, PH - 32); doc.text(`Page ${i} of ${n}`, PW - M, PH - 32, {align:'right'});
  }
  doc.save(fileBase(m) + '.pdf');
  toast('PDF exported.');
});

$('#pptBtn').addEventListener('click', async () => {
  if(!needSummary()) return;
  if(!window.PptxGenJS){ toast('The PowerPoint tool didn\'t load. Check your connection and reload the page.'); return; }
  const m = current, s = m.summary, title = titleOf(m).replace(/^example:\s*/i,'');
  const p = new PptxGenJS(); p.layout = 'LAYOUT_WIDE'; p.title = title; p.subject = 'Meeting summary';
  const C = {ink:'141A2A', muted:'5A6378', acc:'2F4BD8', rec:'D63A40', line:'D4DAE5', soft:'EEF1FB'}, F = 'Calibri';
  // title slide
  let sl = p.addSlide(); sl.background = {color:'0D111D'};
  sl.addShape(p.ShapeType.ellipse, {x:0.8, y:0.95, w:0.22, h:0.22, fill:{color:C.rec}, line:{color:C.rec}});
  sl.addText('MEETING SUMMARY', {x:1.15, y:0.85, w:6, h:0.42, fontFace:F, fontSize:13, bold:true, color:'8FA2FF', charSpacing:3});
  sl.addText(title, {x:0.8, y:2.2, w:11.7, h:2.0, fontFace:F, fontSize:42, bold:true, color:'FFFFFF', valign:'top', fit:'shrink'});
  const ml = metaLine(m).replace(/  ·  /g, '   |   ');
  if(ml) sl.addText(ml, {x:0.8, y:4.5, w:11.7, h:0.9, fontFace:F, fontSize:16, color:'B9C1D6', valign:'top'});
  const content = h => {
    const x = p.addSlide(); x.background = {color:'FFFFFF'};
    x.addShape(p.ShapeType.rect, {x:0, y:0, w:13.33, h:0.1, fill:{color:C.acc}, line:{color:C.acc}});
    x.addText(h, {x:0.7, y:0.38, w:11.9, h:0.8, fontFace:F, fontSize:28, bold:true, color:C.ink});
    x.addText(title, {x:0.7, y:6.95, w:9, h:0.3, fontFace:F, fontSize:10, color:C.muted});
    return x;
  };
  const bulletSlides = (h, items, per = 6) => {
    for(let i = 0; i < items.length; i += per){
      const pages = Math.ceil(items.length / per);
      const x = content(pages > 1 ? `${h} (${i/per + 1} of ${pages})` : h);
      x.addText(items.slice(i, i + per).map(t => ({text:t, options:{bullet:{indent:20}, breakLine:true, paraSpaceAfter:12}})), {x:0.7, y:1.4, w:11.9, h:5.3, fontFace:F, fontSize:20, color:C.ink, valign:'top', fit:'shrink'});
    }
  };
  if(s.overview){ const x = content('Overview'); x.addText(s.overview, {x:0.7, y:1.4, w:11.9, h:5.3, fontFace:F, fontSize:22, color:C.ink, valign:'top', fit:'shrink', lineSpacingMultiple:1.15}); }
  bulletSlides('Key points', s.keyPoints);
  bulletSlides('Decisions', s.decisions);
  if(s.actionItems.length){
    const per = 7;
    for(let i = 0; i < s.actionItems.length; i += per){
      const pages = Math.ceil(s.actionItems.length / per);
      const x = content(pages > 1 ? `Action items (${i/per + 1} of ${pages})` : 'Action items');
      const hdr = ['Task','Owner','Due'].map(t => ({text:t, options:{bold:true, color:'FFFFFF', fill:{color:C.acc}}}));
      const rows = [hdr, ...s.actionItems.slice(i, i + per).map((a, k) => [a.task, a.owner || 'Unassigned', a.due || '-'].map(t => ({text:t, options:{fill:{color: k % 2 ? 'FFFFFF' : C.soft}}})))];
      x.addTable(rows, {x:0.7, y:1.4, w:11.9, colW:[7.6, 2.4, 1.9], fontFace:F, fontSize:15, color:C.ink, border:{type:'solid', pt:0.75, color:C.line}, valign:'middle', margin:0.08});
    }
  }
  bulletSlides('Open questions', s.openQuestions);
  bulletSlides('Next steps', s.nextSteps);
  try{ await p.writeFile({fileName: fileBase(m) + '.pptx'}); toast('PowerPoint exported.'); }
  catch(e){ toast('Couldn\'t create the PowerPoint file: ' + (e.message || e)); }
});

$('#sClear').addEventListener('click', () => { $('#sKey').value = ''; });
dlg.addEventListener('close', () => {
  if(dlg.returnValue !== 'save') return;
  settings.apiKey = $('#sKey').value.trim(); settings.model = $('#sModel').value.trim() || 'claude-sonnet-5-5';
  settings.lang = $('#sLang').value; settings.saveAudio = $('#sAudio').checked; settings.includeTranscript = $('#sTrans').checked;
  store.set(LS_SET, settings); renderSummary(); toast('Settings saved.');
});

/* ---------- cloud sync (Firebase: Google sign-in + Firestore) ---------- */
// Paste the web app config from Firebase → Project settings → Your apps here.
const FIREBASE_CONFIG = null;
const FB_VER = '10.12.2';
const sync = { fb:null, app:null, auth:null, db:null, user:null, unsub:null, ready:false, state:'off', timer:0, last:{}, pushing:false };
const DEL_KEY = 'minutetaker.deleted.v1';
const deletedIds = new Set(store.get(DEL_KEY, []));
function markDeleted(id){ deletedIds.add(id); store.set(DEL_KEY, [...deletedIds]); scheduleSync(); }
function stable(v){
  if(Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function body(m){ const {audioParts, updatedAt, ...rest} = m; return stable(rest); }
function cloudShape(m){ const {audioParts, ...rest} = m; return JSON.parse(JSON.stringify(rest)); }
const lastKey = () => 'minutetaker.synced.' + (sync.user ? sync.user.uid : '');
function editingMain(){ const a = document.activeElement; return !!(a && a.closest && a.closest('main') && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')); }

function setSync(state, detail){ sync.state = state; renderSyncUI(detail); }
function renderSyncUI(detail){
  if(!FIREBASE_CONFIG) return;
  const b = $('#syncBtn'); b.hidden = false;
  const map = { off:['Sign in',''], connecting:['Connecting','busy'], syncing:['Syncing','busy'], synced:['Synced','ok'], offline:['Offline',''], error:['Sync error','bad'] };
  const [label, cls] = map[sync.state] || map.off;
  b.className = 'btn ghost sync ' + cls; b.querySelector('.lbl').textContent = label;
  b.title = detail || (sync.user ? `Signed in as ${sync.user.email}` : 'Sign in to sync meetings between devices');
  $('#syncBox').hidden = false;
  $('#sSignIn').hidden = !!sync.user; $('#sSignOut').hidden = !sync.user;
  $('#sSync').textContent = sync.user
    ? `Signed in as ${sync.user.email}. Meetings, transcripts and summaries sync to your other devices. Audio stays on the device that recorded it.`
    : 'Sign in with Google to see the same meetings on your phone and your Mac.';
}
async function loadFirebase(){
  if(sync.fb) return sync.fb;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  sync.app = app.initializeApp(FIREBASE_CONFIG);
  sync.auth = auth.getAuth(sync.app);
  sync.db = fs.getFirestore(sync.app);
  sync.fb = {auth, fs};
  return sync.fb;
}
function signInMsg(e){
  const c = (e && e.code) || '';
  if(c === 'auth/unauthorized-domain') return 'Sign-in isn\'t allowed from this address yet. In Firebase, add it under Authentication → Settings → Authorized domains.';
  if(c === 'auth/network-request-failed') return 'Sign-in needs an internet connection.';
  if(c === 'auth/operation-not-allowed') return 'Google sign-in is turned off. Enable it in Firebase under Authentication → Sign-in method.';
  return 'Sign-in didn\'t work: ' + ((e && e.message) || c || 'unknown error');
}
async function initSync(){
  if(!FIREBASE_CONFIG) return;
  setSync('connecting');
  try{ await loadFirebase(); }catch{ setSync('error', 'Couldn\'t load sync. Check your connection and reload.'); return; }
  const {auth} = sync.fb;
  auth.getRedirectResult(sync.auth).catch(e => toast(signInMsg(e)));
  auth.onAuthStateChanged(sync.auth, u => {
    sync.user = u;
    if(u) startListening(); else { stopListening(); setSync('off'); }
  });
}
async function signIn(){
  try{ await loadFirebase(); }catch{ toast('Couldn\'t load sign-in. Check your connection.'); return; }
  const {auth} = sync.fb, p = new auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  try{ await auth.signInWithPopup(sync.auth, p); }
  catch(e){
    if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
      try{ await auth.signInWithRedirect(sync.auth, p); }catch(e2){ toast(signInMsg(e2)); }
    } else if(e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast(signInMsg(e));
  }
}
async function signOutSync(){
  if(rec.active){ toast('Stop recording first.'); return; }
  try{ await sync.fb.auth.signOut(sync.auth); toast('Signed out. Your meetings stay on this device.'); }catch{}
}
const colRef = () => sync.fb.fs.collection(sync.db, 'users', sync.user.uid, 'meetings');
function stopListening(){ if(sync.unsub){ sync.unsub(); sync.unsub = null; } sync.ready = false; }
function startListening(){
  stopListening();
  sync.last = store.get(lastKey(), {});
  setSync('syncing');
  sync.unsub = sync.fb.fs.onSnapshot(colRef(), snap => {
    let changed = false, added = false;
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed' || ch.doc.metadata.hasPendingWrites) return;
      const r = applyRemote(ch.doc.id, ch.doc.data());
      if(r) changed = true; if(r === 'added') added = true;
    });
    store.set(lastKey(), sync.last);
    if(changed){
      if(added) meetings.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      store.set(LS_KEY, meetings); refreshAfterRemote();
    }
    if(!sync.ready){ sync.ready = true; pushDirty(); }
    else if(!sync.pushing) setSync('synced');
  }, err => setSync('error', err.code === 'permission-denied' ? 'Firestore refused access. Check the security rules.' : err.message));
}
function applyRemote(id, d){
  const idx = meetings.findIndex(m => m.id === id), local = meetings[idx];
  if(d.deleted){
    sync.last[id] = 'deleted';
    if(!deletedIds.has(id)){ deletedIds.add(id); store.set(DEL_KEY, [...deletedIds]); }
    if(!local || (local === current && (rec.active || editingMain()))) return false;
    meetings.splice(idx, 1);
    if(current === local) current = meetings[0] || null;
    return true;
  }
  if(deletedIds.has(id)) return false;               // deleted here; pushDirty sends the tombstone
  const rb = body(d);
  if(local && body(local) === rb){ sync.last[id] = rb; if((local.updatedAt || 0) < (d.updatedAt || 0)) local.updatedAt = d.updatedAt; return false; }
  if(local && (local.updatedAt || 0) > (d.updatedAt || 0)) return false;   // ours is newer; it will be pushed
  if(local && local === current && (rec.active || editingMain())) return false;
  const merged = Object.assign({}, d, {audioParts: local ? (local.audioParts || 0) : 0});
  sync.last[id] = rb;
  if(local){ meetings[idx] = merged; if(current === local) current = merged; return true; }
  meetings.push(merged); if(!current) current = merged;
  return 'added';
}
function refreshAfterRemote(){
  if(rec.active || editingMain()){ renderLibrary(); return; }
  renderAll();
}
function scheduleSync(){
  if(!sync.user || !sync.ready) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(pushDirty, 1200);
}
async function pushDirty(){
  if(!sync.user || !sync.ready) return;
  const {fs} = sync.fb, jobs = [];
  for(const m of meetings){
    if(m.example) continue;
    const b = body(m);
    if(sync.last[m.id] === b) continue;
    m.updatedAt = Date.now();
    jobs.push(fs.setDoc(fs.doc(colRef(), m.id), cloudShape(m)).then(() => { sync.last[m.id] = b; }));
  }
  for(const id of deletedIds){
    if(id === 'example' || sync.last[id] === 'deleted') continue;
    jobs.push(fs.setDoc(fs.doc(colRef(), id), {deleted:true, updatedAt: Date.now()}).then(() => { sync.last[id] = 'deleted'; }));
  }
  if(!jobs.length){ setSync(navigator.onLine === false ? 'offline' : 'synced'); return; }
  sync.pushing = true; setSync(navigator.onLine === false ? 'offline' : 'syncing');
  store.set(LS_KEY, meetings);
  try{ await Promise.all(jobs); setSync('synced'); }
  catch(e){ setSync('error', e.code === 'permission-denied' ? 'Firestore refused the save. Check the security rules.' : 'Couldn\'t save to the cloud: ' + e.message); }
  finally{ sync.pushing = false; store.set(lastKey(), sync.last); }
}
window.addEventListener('online', () => { if(sync.user){ setSync('syncing'); pushDirty(); } });
window.addEventListener('offline', () => { if(sync.user) setSync('offline'); });
$('#syncBtn').addEventListener('click', () => sync.user ? $('#setBtn').click() : signIn());
$('#sSignIn').addEventListener('click', () => { dlg.close(); signIn(); });
$('#sSignOut').addEventListener('click', () => { dlg.close(); signOutSync(); });

/* ---------- boot ---------- */
function renderAll(){
  const none = !current;
  $('#noMeeting').hidden = !none;
  document.querySelectorAll('main > :not(#noMeeting)').forEach(e => e.hidden = none);
  renderLibrary();
  if(none){ updateRecUI(); return; }
  renderMeta(); renderTranscript(); renderSummary(); renderAudio(); updateRecUI(); renderClock(); setStatus(current.example ? 'This is an example meeting. Tap New meeting to record your own.' : ''); drawMeter(); }
$('#emptyNew').addEventListener('click', () => $('#newBtn').click());
if(window.innerWidth > 900) $('#library').open = true;
renderAll();
initSync();
})();
</script>
</body>
